# Database Configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.username=library
quarkus.datasource.password=library
quarkus.datasource.jdbc.url=jdbc:h2:mem:library_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# Hibernate ORM Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.show-sql=true

# H2 Console (for development only)
quarkus.datasource.jdbc.additional-jdbc-properties.web-allow-others=true
quarkus.h2.console.enabled=true

# Logging Configuration
quarkus.log.category."org.hibernate".level=DEBUG
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE

# Application Configuration
quarkus.http.port=8080
quarkus.application.name=Davon Library System 