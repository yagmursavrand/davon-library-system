# =====================================================
# MSSQL Datasource Configuration
# =====================================================
quarkus.datasource.db-kind=mssql
quarkus.datasource.username=sa
quarkus.datasource.password=Backend2025
quarkus.datasource.jdbc.url=jdbc:sqlserver://localhost:1433;databaseName=LibraryManagementSystem;TrustServerCertificate=true;

# =====================================================
# Hibernate ORM Configuration
# =====================================================
# 'validate' checks if the database schema matches the JPA entities.
# Use 'none' if you don't want any schema changes or validation.
# Use 'drop-and-create' only for early development or testing.
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=true

# =====================================================
# Logging Configuration
# =====================================================
quarkus.log.level=INFO
quarkus.log.category."org.hibernate".level=INFO
quarkus.log.category."org.hibernate.SQL".level=DEBUG
quarkus.log.category."org.hibernate.type.descriptor.sql.BasicBinder".level=TRACE

# =====================================================
# Application Configuration
# =====================================================
quarkus.http.port=8082
quarkus.application.name=Davon Library System
